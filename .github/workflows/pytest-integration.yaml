name: Integration Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
  workflow_dispatch: {}

jobs:
  integration:
    name: Integration Tests
    timeout-minutes: 40
    runs-on: depot-ubuntu-24.04-16
    strategy:
      matrix:
        python_version: ["3.10", "3.12", "3.13", "3.14t"]
    env:
      PYX_API_KEY: ${{ secrets.PYX_READ_ONLY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
          freethreaded: ${{ endsWith(matrix.python_version, 't') }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Cache venv for free-threaded Python
        if: endsWith(matrix.python_version, 't')
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-integration-${{ matrix.python_version }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - name: Setup
        run: |
          set -ex
          if [[ "${{ matrix.python_version }}" == *"t" ]]; then
            # Free-threaded Python: skip test group (mosaicml-streaming->cryptography doesn't support 3.14t)
            # Install only compatible extras and essential test deps. ``hf``
            # is opted in so the HF integration tests actually exercise
            # ``huggingface_hub`` on 3.14t — without it they'd skip.
            uv sync --python ${{ matrix.python_version }} --group dev --extra parquet --extra cloud --extra litdata --extra hf
            uv pip install pytest pytest-timeout
          else
            uv sync --python ${{ matrix.python_version }} --group dev --group test --all-extras
          fi
      - name: Run Integration Tests
        env:
          # Enforce GIL-disabled mode on free-threaded Python to catch threading issues
          PYTHON_GIL: ${{ endsWith(matrix.python_version, 't') && '0' || '' }}
        run: |
          set -ex
          uv run --python ${{ matrix.python_version }} pytest -m "integration and not requires_ray" --run-integration --full-trace --timeout=180 --timeout-method=thread --tb=long --capture=tee-sys -vv --maxfail=10

  ray-integration:
    name: Ray Integration Tests
    timeout-minutes: 40
    runs-on: depot-ubuntu-24.04-16
    env:
      PYX_API_KEY: ${{ secrets.PYX_READ_ONLY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Setup
        run: |
          set -ex
          uv sync --python 3.12 --group dev --group test --all-extras
      - name: Clean stale Ray state
        run: |
          ray stop --force 2>/dev/null || true
          rm -rf /tmp/ray
      - name: Run Ray Integration Tests
        # --reruns=2 is a backstop for known Ray-side worker-startup
        # SIGSEGVs in glog (logging.cc) — narrowly scoped via --only-rerun
        # so genuine bugs are not retried.  See PR #282.
        run: |
          set -ex
          uv run --python 3.12 pytest -m "integration and requires_ray" --run-integration --full-trace --timeout=180 --timeout-method=thread --tb=long --capture=tee-sys -vv --maxfail=10 \
            --reruns=2 --only-rerun "WorkerCrashed|ActorDiedError|Segmentation"
