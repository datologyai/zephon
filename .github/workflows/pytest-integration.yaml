name: Integration Tests

permissions:
  contents: read

# Integration collects only `-m integration`; no such test reads docs/ or a
# top-level .md, so docs-only changes cannot affect this suite.
on:
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    # Base-branch filter: stack-internal PRs (base = another feature branch)
    # keep unit/lint signal but skip this 4-version matrix until they retarget
    # main. Use workflow_dispatch to run one on demand.
    branches:
      - main
      - release/*
    paths-ignore:
      - "*.md"
      - "docs/**"
  workflow_dispatch: {}

# PR pushes cancel the superseded run; push/dispatch runs fall back to
# run_id so they are always their own group and never cancel each other.
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  integration:
    name: Integration Tests (${{ matrix.python_version }}, ${{ matrix.shard }})
    timeout-minutes: 40
    runs-on: LargeGithubRunner
    strategy:
      matrix:
        python_version: ["3.10", "3.12", "3.13", "3.14t"]
        shard: ["elastic-io", "remainder"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
          freethreaded: ${{ endsWith(matrix.python_version, 't') }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
      - name: Cache venv for free-threaded Python
        if: endsWith(matrix.python_version, 't')
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-integration-${{ matrix.python_version }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - name: Setup
        run: |
          set -ex
          if [[ "${{ matrix.python_version }}" == *"t" ]]; then
            # Free-threaded Python: skip test group (mosaicml-streaming->cryptography doesn't support 3.14t)
            # Install only compatible extras and essential test deps. ``hf``
            # is opted in so the HF integration tests actually exercise
            # ``huggingface_hub`` on 3.14t — without it they'd skip.
            uv sync --python ${{ matrix.python_version }} --group dev --extra parquet --extra cloud --extra litdata --extra hf
            uv pip install pytest pytest-timeout
          else
            uv sync --python ${{ matrix.python_version }} --group dev --group test --all-extras
          fi
      - name: Run Integration Tests
        env:
          # Enforce GIL-disabled mode on free-threaded Python to catch threading issues
          PYTHON_GIL: ${{ endsWith(matrix.python_version, 't') && '0' || '' }}
        run: |
          set -ex
          case "${{ matrix.shard }}" in
            elastic-io)
              test_targets=(
                tests/integration/test_elastic_continuation.py
                tests/integration/test_jsonl_integration.py
                tests/integration/test_torchdata_stateful_elasticity.py
              )
              ;;
            remainder)
              test_targets=(
                tests/integration
                --ignore=tests/integration/test_elastic_continuation.py
                --ignore=tests/integration/test_jsonl_integration.py
                --ignore=tests/integration/test_torchdata_stateful_elasticity.py
              )
              ;;
          esac
          uv run --python ${{ matrix.python_version }} pytest "${test_targets[@]}" \
            -m "integration and not requires_ray" --run-integration --full-trace \
            --timeout=180 --timeout-method=thread --tb=long \
            --capture=tee-sys -vv --maxfail=10

  ray-integration:
    name: Ray Integration Tests
    timeout-minutes: 40
    runs-on: LargeGithubRunner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
      - name: Setup
        run: |
          set -ex
          uv sync --python 3.12 --group dev --group test --all-extras
      - name: Clean stale Ray state
        run: |
          ray stop --force 2>/dev/null || true
          rm -rf /tmp/ray
      - name: Run Ray Integration Tests
        # --reruns=2 is a backstop for known Ray-side worker-startup
        # SIGSEGVs in glog (logging.cc) — narrowly scoped via --only-rerun
        # so genuine bugs are not retried.  See PR #282.
        run: |
          set -ex
          uv run --python 3.12 pytest -m "integration and requires_ray" --run-integration --full-trace --timeout=180 --timeout-method=thread --tb=long --capture=tee-sys -vv --maxfail=10 \
            --reruns=2 --only-rerun "WorkerCrashed|ActorDiedError|Segmentation"
