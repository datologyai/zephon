name: Integration Tests

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
      - release/*
  workflow_dispatch: {}

jobs:
  integration:
    name: Integration Tests
    timeout-minutes: 40
    runs-on: LargeGithubRunner
    strategy:
      matrix:
        python_version: ["3.10", "3.12", "3.13", "3.14t"]
    env:
      PYX_API_KEY: ${{ secrets.PYX_READ_ONLY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
          freethreaded: ${{ endsWith(matrix.python_version, 't') }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Cache venv for free-threaded Python
        if: endsWith(matrix.python_version, 't')
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-integration-${{ matrix.python_version }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - name: Setup
        run: |
          set -ex
          if [[ "${{ matrix.python_version }}" == *"t" ]]; then
            # Free-threaded Python: skip test group (mosaicml-streaming->cryptography doesn't support 3.14t)
            # Install only compatible extras and essential test deps
            uv sync --python ${{ matrix.python_version }} --group dev --extra parquet --extra cloud --extra litdata
            uv pip install pytest pytest-timeout
          else
            uv sync --python ${{ matrix.python_version }} --group dev --group test --all-extras
          fi
      - name: Run Integration Tests
        env:
          # Enforce GIL-disabled mode on free-threaded Python to catch threading issues
          PYTHON_GIL: ${{ endsWith(matrix.python_version, 't') && '0' || '' }}
        run: |
          set -ex
          uv run --python ${{ matrix.python_version }} pytest -m integration --run-integration --full-trace --timeout=180 --timeout-method=thread --tb=long --capture=tee-sys -vv --maxfail=10

