name: Unit Tests

on:
  push:
    branches:
    - main
    - release/*
  pull_request:
    branches:
    - main
    - release/*
  workflow_call:
  workflow_dispatch: {}
jobs:
  unit:
    name: Unit Tests
    timeout-minutes: 20
    runs-on: ${{ (startsWith(matrix.python_version, '3.14') || endsWith(matrix.python_version, 't')) && 'LargeGithubRunner' || 'ubuntu-latest' }}
    env:
      PYX_API_KEY: ${{ secrets.PYX_READ_ONLY_KEY }}
    strategy:
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
        allow-prereleases: true
        freethreaded: ${{ endsWith(matrix.python_version, 't') }}
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.17"
    - name: Restore venv cache for slow builds
      if: startsWith(matrix.python_version, '3.14') || endsWith(matrix.python_version, 't')
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: venv-unit-${{ matrix.python_version }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
    - name: Setup
      run: |
        set -ex
        if [[ "${{ matrix.python_version }}" == *"t" ]]; then
          # Free-threaded Python: skip test group (mosaicml-streaming->cryptography doesn't support 3.14t)
          # Install only compatible extras and essential test deps
          uv sync --python ${{ matrix.python_version }} --group dev --extra parquet --extra cloud --extra litdata
          uv pip install pytest pytest-timeout
        else
          uv sync --python ${{ matrix.python_version }} --group dev --group test --all-extras
        fi
    - name: Run Unit Tests
      env:
        # Enforce GIL-disabled mode on free-threaded Python to catch threading issues
        PYTHON_GIL: ${{ endsWith(matrix.python_version, 't') && '0' || '' }}
      run: |
        set -ex
        uv run --python ${{ matrix.python_version }} pytest -m "not integration" --maxfail=10
    - name: Save venv cache for slow builds
      if: always() && (startsWith(matrix.python_version, '3.14') || endsWith(matrix.python_version, 't'))
      uses: actions/cache/save@v4
      with:
        path: .venv
        key: venv-unit-${{ matrix.python_version }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

