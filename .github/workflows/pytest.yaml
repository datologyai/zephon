name: Unit Tests

permissions:
  contents: read

# Docs-only changes are skipped, except docs/source/examples/index.md, which
# tests/test_examples.py reads. That carve-out needs `paths` with a trailing
# re-include (last matching pattern wins); `paths-ignore` cannot express it.
on:
  push:
    branches:
    - main
    - release/*
    paths:
    - "**"
    - "!*.md"
    - "!docs/**"
    - "docs/source/examples/**"
  pull_request:
    paths:
    - "**"
    - "!*.md"
    - "!docs/**"
    - "docs/source/examples/**"
  workflow_call:
  workflow_dispatch: {}

# PR pushes cancel the superseded run; push/dispatch runs fall back to
# run_id so they are always their own group and never cancel each other.
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests (${{ matrix.python_version }}, ${{ matrix.shard }})
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        python_version: ["3.10", "3.12", "3.13"]
        runner: ["ubuntu-latest"]
        shard: ["process-runner", "remainder"]
        include:
        - python_version: "3.14t"
          runner: LargeGithubRunner
          shard: "all"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
        allow-prereleases: true
        freethreaded: ${{ endsWith(matrix.python_version, 't') }}
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.15"
    - name: Restore venv cache for slow builds
      if: startsWith(matrix.python_version, '3.14') || endsWith(matrix.python_version, 't')
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: venv-unit-${{ matrix.python_version }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
    - name: Setup
      run: |
        set -ex
        if [[ "${{ matrix.python_version }}" == *"t" ]]; then
          # Free-threaded Python: skip test group (mosaicml-streaming->cryptography doesn't support 3.14t)
          # Install only compatible extras and essential test deps. ``hf``
          # is opt-in here so HFBackend's huggingface_hub-using tests
          # (download/resume/error mapping) actually run on 3.14t.
          uv sync --python ${{ matrix.python_version }} --group dev --extra parquet --extra cloud --extra litdata --extra hf
          uv pip install pytest pytest-timeout pydantic attrs
        else
          uv sync --python ${{ matrix.python_version }} --group dev --group test --all-extras
        fi
    - name: Run Unit Tests
      env:
        # Enforce GIL-disabled mode on free-threaded Python to catch threading issues
        PYTHON_GIL: ${{ endsWith(matrix.python_version, 't') && '0' || '' }}
      run: |
        set -ex
        case "${{ matrix.shard }}" in
          process-runner)
            test_targets=(tests/zephon/_internal/runners/test_process.py)
            ;;
          remainder)
            test_targets=(
              tests
              --ignore=tests/fuzzing
              --ignore=tests/zephon/_internal/runners/test_process.py
            )
            ;;
          all)
            test_targets=(
              tests
              --ignore=tests/fuzzing
            )
            ;;
        esac
        uv run --python ${{ matrix.python_version }} pytest "${test_targets[@]}" \
          -m "not integration and not requires_ray" --maxfail=10
    - name: Save venv cache for slow builds
      if: always() && (startsWith(matrix.python_version, '3.14') || endsWith(matrix.python_version, 't'))
      uses: actions/cache/save@v4
      with:
        path: .venv
        key: venv-unit-${{ matrix.python_version }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
  lowest-bounds:
    # Installs the OLDEST versions allowed by pyproject.toml (instead of uv.lock)
    # to verify the declared `>=` floors; on failure, bump the offending floor.
    name: Unit Tests (lowest bounds, ${{ matrix.shard }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ["process-runner", "remainder"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.15"
    - name: Setup
      run: |
        set -ex
        uv sync --python 3.10 --resolution lowest-direct --group dev --group test --all-extras
    - name: Run Unit Tests
      run: |
        set -ex
        case "${{ matrix.shard }}" in
          process-runner)
            test_targets=(tests/zephon/_internal/runners/test_process.py)
            ;;
          remainder)
            test_targets=(
              tests
              --ignore=tests/zephon/_internal/runners/test_process.py
            )
            ;;
        esac
        uv run --python 3.10 --no-sync pytest "${test_targets[@]}" \
          -m "not integration and not requires_ray" --maxfail=10
  packaging:
    name: Packaging Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      PYX_API_KEY: ${{ secrets.PYX_READ_ONLY_KEY }}
    steps:
    - uses: actions/checkout@v4
      with:
        # setuptools-scm derives the version from git history/tags.
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.17"
    - name: Setup
      run: uv sync --python 3.12 --group dev
    - name: Run Packaging Tests
      run: uv run --python 3.12 pytest --run-packaging tests/packaging -ra

  ray:
    name: Ray Tests
    timeout-minutes: 20
    runs-on: LargeGithubRunner
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.15"
    - name: Setup
      run: |
        set -ex
        uv sync --python 3.12 --group dev --group test --all-extras
    - name: Clean stale Ray state
      run: |
        ray stop --force 2>/dev/null || true
        rm -rf /tmp/ray
    - name: Run Ray Tests
      # --reruns=2 is a backstop for known Ray-side worker-startup
      # SIGSEGVs in glog (logging.cc) — narrowly scoped via --only-rerun
      # so genuine bugs are not retried.  See PR #282.
      run: |
        set -ex
        uv run --python 3.12 pytest -m "requires_ray" --maxfail=10 \
          --reruns=2 --only-rerun "WorkerCrashed|ActorDiedError|Segmentation"
