name: Documentation

# Docs are published from main's copy of this workflow. A release event runs
# the workflow file of the tagged commit, so this branch keeps only the hook
# that hands a published release to main; keep dispatch-release in step with
# main's docs.yaml.

on:
  push:
    branches:
    - main
    - release/*
  pull_request:
    branches:
    - main
    - release/*
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dispatch-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Publish the release's docs from main
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: gh workflow run docs.yaml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f tag="$TAG"

  # Build only, as a check: nothing on a release branch deploys. No concurrency
  # group, so these runs never cancel a publish waiting in main's pages queue.
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.15"
    - name: Install dependencies
      run: |
        uv sync --group dev --all-extras
    - name: Build documentation
      run: |
        uv run sphinx-build -b html -W --keep-going docs/source docs/build/html
