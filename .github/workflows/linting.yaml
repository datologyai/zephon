name: Linting

permissions:
  contents: read

on:
  push:
    branches:
    - main
    - release/*
  pull_request:
    branches:
    - main
    - release/*
  workflow_call:
  workflow_dispatch: {}
defaults:
  run:
    working-directory: .
jobs:
  linting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Single Python version for linting - no need for matrix
    env:
      PYTHON_VERSION: "3.12"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    # Key caches per runner image: wheels built from source link that image's
    # glibc. $ImageOS (ubuntu24, ubuntu26, ...) is not in the `env` context.
    - name: Expose runner image for cache keys
      run: echo "IMAGE_OS=${ImageOS:?}" >> "$GITHUB_ENV"
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.15"
        cache-suffix: ${{ env.IMAGE_OS }}
    - name: Install dependencies
      run: |
        uv sync --group dev
    - name: Run ruff format check
      run: |
        uv run ruff format --check . --exclude zephon/_version.py --exclude docs/
    - name: Run ruff lint
      run: |
        uv run ruff check . --exclude zephon/_version.py --exclude docs/
    - name: Run pyright type check
      run: |
        uv run pyright
    - name: Type-check the public-API consumer fixture
      run: |
        uv run pyright tests/typing
