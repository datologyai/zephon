:root {
  color-scheme: light;
  --figure-font: 'Figure Geist', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --figure-font-size: 13px;
  --figure-label-size: 12px;
  --figure-background: transparent;
  --figure-surface: #fff;
  --foreground: #12302f;
  --muted-foreground: #4a6f6c;
  --muted: #dcebe7;
  --border: #a7c6c1;
  --figure-accent: #0a9d87;
  --figure-hover: #ecf6f4;
  /* The references put dark ink on the series colours, not white: they are
     mid-tones chosen to carry it in either theme. */
  --figure-oncolor: #0d2423;
  --viz-series-1: #0aa893;
  --viz-series-2: #ba5b8a;
  --viz-series-3: #ae7200;
  --viz-series-4: #8c6bc3;
  --figure-radius: 4px;
  --figure-padding: 20px 20px 12px;
  --figure-page-padding: 10px 6px;
  --figure-max-width: 1100px;
  --figure-control-radius: 4px;
  --figure-control-size: 44px;
  --figure-play-size: 64px;
  --figure-play-offset: 0px;
  --figure-play-padding: 16px 20px;
  --figure-play-radius: 8px;
  --figure-play-backdrop: color-mix(in srgb, var(--figure-surface) 75%, transparent);
  --figure-shadow: 0 2px 6px rgb(4 26 25 / 10%);
  --figure-shadow-active: 0 2px 9px rgb(4 26 25 / 16%);
  --figure-motion-duration: 140ms;
  /* Plot type, kept apart from the animations' label size: the references set
     their legends and tick labels noticeably larger than a diagram's labels,
     and a chart with small type reads as a thumbnail of itself. */
  --plot-legend-size: 15px;
  --plot-axis-size: 13px;
  --plot-name-size: 14px;
  --plot-value-size: 15px;
  --plot-title-size: 17px;
  /* Plot geometry. A carousel swaps one figure for another in the same iframe,
     so two figures shown as panels must be exactly as tall as each other: the
     plot's aspect and the space reserved for the note below it are both declared
     here, and a figure that carousels with another inherits them rather than
     setting its own. The note's height is reserved rather than measured, so a
     longer caption on one panel cannot make that panel taller. */
  --plot-aspect: 2.0;
  --plot-min-width: 420px;
  /* Two line boxes exactly: a reserve that is not a whole number of lines is
     shorter than the text it has to hold the moment a note wraps. */
  --plot-note-height: 3em;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --figure-surface: #15302f;
  --foreground: #d8f8f2;
  --muted-foreground: #7e9b98;
  --muted: #22403e;
  --border: #456260;
  --figure-accent: #00efb5;
  --figure-hover: #1b3a38;
}
@media (max-width: 520px) {
  :root { --figure-padding: 16px 12px 8px; --figure-page-padding: 6px 0; }
}

/* Figure-local colours. Shared typography/controls: ../shared/theme.css.
 *
 * Shared with ../eval-fineweb: the two suites are one comparison shown twice, so
 * the loaders must not change colour between them. */
:root {
  --ev-standard: #a8453d;
  --ev-zephon: #0f7d6c;
  --ev-band: rgb(15 125 108 / 0.22);
  --plot-grid: #dfeae8;

     these two values must stay identical between them. */
  --plot-min-width: 360px;

}
:root[data-theme="dark"] {

}

  <style>
/* src/base.css */
/* Shared typography and controls; all branding is in theme.css. */
* { box-sizing: border-box; }
html { background: var(--figure-background); }
body {
  margin: 0; padding: var(--figure-page-padding); background: var(--figure-background);
  color: var(--foreground); font: var(--figure-font-size)/1.5 var(--figure-font);
  -webkit-font-smoothing: antialiased;
}
main { max-width: var(--figure-max-width); margin: 0 auto; }
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { opacity: .4; cursor: default; }
[hidden] { display: none !important; }
.text-small { font-size: var(--figure-label-size); }
.tabular-nums { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-width: var(--figure-control-size); min-height: var(--figure-control-size);
  padding: 8px; border: 1px solid transparent; border-radius: var(--figure-control-radius);
  background: transparent; color: var(--foreground); cursor: pointer;
  transition: background var(--figure-motion-duration), color var(--figure-motion-duration);
}
.btn:hover:not(:disabled) { background: var(--figure-hover); color: var(--figure-accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--figure-accent); outline-offset: 3px; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
noscript { display: block; margin: 1em; }
body.export-mode { padding: 14px 32px 0; }
body.export-mode main { width: 740px; max-width: none; }
body.export-mode .za-controls, body.export-mode .za-start { display: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }

</style>

/* ../shared/plot.css */
/* Shared responsive shell for the standalone evaluation and throughput plots. */
:root {
  --plot-min-width: 0px;
  --plot-min-height: 340px;
}
.plot-figure {
  color: var(--foreground); background: var(--figure-background);
  border: 1px solid var(--border); border-radius: var(--figure-radius);
  padding: var(--figure-padding);
}
.plot-canvas {
  width: 100%; min-width: var(--plot-min-width);
  aspect-ratio: var(--plot-aspect); min-height: var(--plot-min-height);
}
.plot-stage { min-width: 0; }
.plot-stage:focus-visible { outline: 2px solid var(--figure-accent); outline-offset: 2px; }
.plot-note {
  margin: 6px 0 0; color: var(--muted-foreground); font-size: var(--figure-label-size);
  min-height: var(--plot-note-height);
}
@media (max-width: 520px) {
  :root {
    --figure-padding: 12px 8px 8px;
    --figure-label-size: 11px;
    --plot-legend-size: 12px;
    --plot-axis-size: 11px;
    --plot-name-size: 12px;
    --plot-value-size: 12px;
    --plot-title-size: 15px;
    --plot-note-height: 4.5em;
  }
}
@media print { .plot-note { display: none; } }

</style>

<script>
/* ../shared/plot.js */
/* Plumbing shared by the ECharts figures: theme tokens, mounting, resizing and
 * the small public API each plot exposes. A figure's own `chart.js` only has to
 * build an option object.
 *
 * Two things here are not ECharts defaults and are deliberate. The renderer is
 * SVG, to keep these modest datasets as inspectable shapes and real text. And every colour comes from a CSS custom property read at mount
 * time rather than being written into the option, so one palette drives the
 * figures and the animations alike, and a theme change is a re-read rather than
 * a second set of hard-coded hexes.
 */
(function (scope) {
  'use strict';

  function tokens(root) {
    const style = getComputedStyle(root);
    const read = name => style.getPropertyValue(name).trim();
    return {
      read,
      ink: read('--foreground'),
      muted: read('--muted-foreground'),
      line: read('--border'),
      grid: read('--plot-grid'),
      surface: read('--figure-surface'),
      accent: read('--figure-accent'),
      font: read('--figure-font'),
      size: Number.parseFloat(read('--figure-label-size')) || 12,
      legendSize: Number.parseFloat(read('--plot-legend-size')) || 15,
      axisSize: Number.parseFloat(read('--plot-axis-size')) || 13,
      nameSize: Number.parseFloat(read('--plot-name-size')) || 14,
      valueSize: Number.parseFloat(read('--plot-value-size')) || 15,
      titleSize: Number.parseFloat(read('--plot-title-size')) || 17,
    };
  }

  /** Round for display without padding with redundant decimal zeros. */
  function decimal(value, places = 1) {
    return String(Number(value.toFixed(places)));
  }

  /** Format a throughput: 5843.7 -> "5.8k", 40000 -> "40k". */
  function perK(value) {
    if (Math.abs(value) >= 1e6) return `${decimal(value / 1e6)}M`;
    if (Math.abs(value) >= 1e3) return `${decimal(value / 1e3)}k`;
    return String(Math.round(value));
  }

  /** A wrapping legend plus the space its rows need above the data grid. */
  function legendLayout(names, t, width) {
    const compact = width < 520;
    const icon = compact ? 16 : 24;
    const gap = compact ? 12 : 22;
    const padding = compact ? 4 : 9;
    const available = width - 8;
    // Use SVG font metrics, as the plots themselves do. A total-width estimate
    // misses partly filled rows and can put the grid underneath a wrapped item.
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const label = document.createElementNS(svg.namespaceURI, 'text');
    svg.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;width:0;height:0';
    label.style.font = `${t.legendSize}px ${t.font}`;
    svg.append(label);
    document.body.append(svg);
    let used = 0, rows = 1;
    for (const name of names) {
      label.textContent = name;
      const item = Math.ceil(label.getComputedTextLength()) + icon + 5;
      if (used && used + gap + item > available) { rows++; used = 0; }
      used += (used ? gap : 0) + item;
    }
    svg.remove();
    return {
      bottom: 2 + padding * 2 + rows * t.legendSize + (rows - 1) * gap + 12,
      option: {
        data: names, top: 2, left: 'center', width: available,
        itemGap: gap, itemWidth: icon, itemHeight: compact ? 9 : 13,
        padding: [padding, 0],
        textStyle: { fontFamily: t.font, color: t.ink, fontSize: t.legendSize },
      },
    };
  }

  /* A plot redraws on a theme change rather than animating into it: there is no
   * timeline here, and a colour transition on every token would be noise. */
  function mount({ root, holder, build, name }) {
    const echarts = scope.echarts;
    if (!echarts) throw new Error('The ECharts bundle is not loaded.');
    const params = new URLSearchParams(location.search);
    if (params.has('export')) document.body.classList.add('export-mode');

    const chart = echarts.init(holder, null, { renderer: 'svg' });
    let option = null;
    let disposed = false;
    let width = holder.clientWidth;
    let height = holder.clientHeight;

    function draw() {
      if (disposed) return;
      // Preserve the reader's legend choices when geometry or theme changes.
      const selected = (chart.getOption()?.legend || []).map(legend => legend.selected);
      option = build(tokens(root), { width: holder.clientWidth, height: holder.clientHeight });
      const legends = option.legend ? (Array.isArray(option.legend) ? option.legend : [option.legend]) : [];
      legends.forEach((legend, i) => { if (selected[i]) legend.selected = selected[i]; });
      chart.setOption(option, { notMerge: true });
      root.dataset.ready = 'true';
    }
    function resize() {
      if (disposed) return;
      width = holder.clientWidth;
      height = holder.clientHeight;
      chart.resize();
      draw();
    }
    draw();
    const observer = 'ResizeObserver' in scope ? new ResizeObserver(() => {
      if (holder.clientWidth !== width || holder.clientHeight !== height) resize();
    }) : null;
    observer?.observe(holder);
    if (!observer) scope.addEventListener('resize', resize);
    const themeObserver = new MutationObserver(draw);
    themeObserver.observe(document.documentElement,
      { attributes: true, attributeFilter: ['data-theme'] });
    const media = matchMedia('(prefers-color-scheme: dark)');
    media.addEventListener('change', draw);
    // ECharts measures labels during layout. Repeat after the local font loads.
    document.fonts?.ready.then(draw);

    const api = {
      redraw: draw,
      option: () => option,
      resize,
      snapshot: () => ({
        ready: !disposed && root.dataset.ready === 'true',
        renderer: 'svg',
        series: disposed ? [] : chart.getOption().series.map(s => ({ name: s.name, type: s.type, points: s.data.length })),
      }),
      destroy() {
        if (disposed) return;
        disposed = true;
        observer?.disconnect();
        themeObserver.disconnect();
        scope.removeEventListener('resize', resize);
        media.removeEventListener('change', draw);
        chart.dispose();
        delete root.dataset.ready;
        if (scope[name] === api) delete scope[name];
      },
    };
    scope[name] = api;
    return api;
  }

  const plot = { tokens, decimal, perK, mount, legendLayout };
  if (typeof module !== 'undefined' && module.exports) module.exports = plot;
  else scope.ZephonPlot = plot;
})(globalThis);

</script>
<script>
/* src/scenario.js */
/* Edit this file for the figure's content: the measured scores, the noise floor
 * they are read against, and which token colours the two loaders draw with.
 *
 * Blog figure 3, FineWeb. Its companion is ../eval-dclm, the same comparison on
 * the other suite; the blog shows them as two panels of one carousel, so they
 * are two figures rather than two grids in one.
 *
 * The numbers are transcribed from the published run export,
 * `zephon-sosp-plots/plots/blogfigure_3_eval_topology/blogfigure_3.csv`, at data
 * seed 42. The composition follows `figma/ZEPHON Figures/blogfigure_3_light.jpg`.
 *
 * `noise` is that export's eval re-run noise floor: re-running the same
 * evaluation on the same checkpoint moves the score by about this much, so a
 * difference inside it is not a difference the evaluation could have detected.
 */
(function (scope) {
  'use strict';

  const scenario = {
    suite: 'FineWeb',
    x: { label: 'GPUs used for training', values: [8, 16, 32, 64] },
    y: { label: 'Benchmark score (pp)' },

    loaders: [
      { name: 'Standard loader', tone: 'standard', symbol: 'triangle' },
      { name: 'Zephon', tone: 'zephon', symbol: 'circle' },
    ],
    bandName: 'Eval re-run noise',

    /* Four thousandths of a point: this suite can resolve a far smaller
     * difference than DCLM Core v1 can, which is why Zephon's spread sits above
     * the floor here and below it there. */
    noise: 0.004174850390548102,
    scores: {
      'Standard loader': [45.76501478331703, 45.65927464280884, 46.30031845975305, 46.06466885631279],
      'Zephon': [45.75398004134518, 45.74808527555492, 45.755946707381, 45.759468770113585],
    },

    source: 'zephon-sosp-plots/plots/blogfigure_3_eval_topology/blogfigure_3.csv',
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = scenario;
  else scope.EvalScenario = scenario;
})(globalThis);

</script>
<script>
/* ../shared/eval-topology/model.js */
/* What the measurements mean. Pure JavaScript: no DOM, browser, ECharts or
 * Zephon dependency.
 *
 * The figure's argument is that one loader's score depends on how many GPUs it
 * trained on and the other's barely does. That is a claim about two spreads read
 * against a noise floor, so this layer computes them and refuses a figure where
 * the claim does not hold -- it cannot be allowed to assert it by composition.
 *
 * The claim is deliberately not "Zephon lands inside the band": on FineWeb its
 * spread is 2.7x the noise floor, because that floor is four thousandths of a
 * point. What holds on both suites is that the standard loader moves by more
 * than the evaluation's own noise while Zephon moves by a small fraction of what
 * the standard loader does.
 */
(function (scope) {
  'use strict';

  const round = (v, places) => Number(v.toFixed(places));

  function buildScene(config) {
    const xs = config.x.values;
    if (!xs.length) throw new Error('The x axis has no values.');
    if (config.loaders.length !== 2) throw new Error('The figure compares exactly two loaders.');
    if (!(config.noise > 0)) throw new Error(`${config.suite} has no noise floor.`);

    const loaders = config.loaders.map(loader => {
      const scores = config.scores[loader.name];
      if (!scores) throw new Error(`${config.suite} has no scores for ${loader.name}.`);
      if (scores.length !== xs.length) {
        throw new Error(`${loader.name} has ${scores.length} scores for ${xs.length} GPU counts.`);
      }
      if (scores.some(v => !Number.isFinite(v))) throw new Error(`${loader.name} has a score that is not a number.`);
      const spread = Math.max(...scores) - Math.min(...scores);
      return {
        ...loader,
        scores,
        points: xs.map((x, i) => [x, scores[i]]),
        mean: scores.reduce((a, b) => a + b, 0) / scores.length,
        spread,
        noiseRatio: round(spread / config.noise, 1),
      };
    });

    const [steady, drifting] = [...loaders].sort((a, b) => a.spread - b.spread);
    if (drifting.spread <= config.noise) {
      throw new Error(`${config.suite}: the worse loader moves by ${round(drifting.spread, 4)}, ` +
        `inside the evaluation's own noise of ${round(config.noise, 4)}, so the figure has ` +
        'nothing to show.');
    }
    if (drifting.spread < steady.spread * 5) {
      throw new Error(`${config.suite}: ${drifting.name} moves only ` +
        `${round(drifting.spread / steady.spread, 1)}x as much as ${steady.name}, which is not ` +
        'the difference this figure is drawn to make.');
    }

    // The band is centred on the loader that holds still: it is the reference
    // the other is being read against.
    const band = [steady.mean - config.noise, steady.mean + config.noise];
    const all = loaders.flatMap(l => l.scores).concat(band);
    const pad = (Math.max(...all) - Math.min(...all)) * 0.18;

    return {
      suite: config.suite,
      x: config.x,
      y: config.y,
      loaders,
      bandName: config.bandName,
      noise: config.noise,
      band,
      steady: steady.name,
      drifting: drifting.name,
      driftRatio: round(drifting.spread / config.noise, 1),
      steadyRatio: round(steady.spread / config.noise, 1),
      timesSteadier: round(drifting.spread / steady.spread, 1),
      range: [Math.min(...all) - pad, Math.max(...all) + pad],
    };
  }

  if (typeof module !== 'undefined' && module.exports) module.exports = { buildScene };
  else scope.EvalModel = { buildScene };
})(globalThis);

</script>
<script>
/* ../shared/eval-topology/chart.js */
/* The ECharts option for this figure, and nothing else: content lives in
 * scenario.js, meaning in model.js, shared plumbing in ../shared/plot.js.
 *
 * Each measurement is drawn as a stem with a head, which is what lets two
 * loaders sit at the same GPU count without a bar chart's visual weight. ECharts
 * has no stem chart, so a stem is a narrow bar and a head is a scatter point;
 * both are placed on a *value* x axis at explicit offsets, so the two line up
 * exactly instead of depending on how a category axis happens to dodge them.
 */
(function () {
  'use strict';

  const root = document.getElementById('zephon-eval');
  const holder = root.querySelector('.ev-plot');
  const config = globalThis.EvalScenario;
  const scene = globalThis.EvalModel.buildScene(config);
  const { decimal, mount, legendLayout } = globalThis.ZephonPlot;

  // Half the distance between the two loaders at one GPU count, in axis units.
  const DODGE = 0.14;

  /* Measured off the reference: a head is 15.4% of the gap between stem pairs
   * and a stem about 4.5% of it. Both are therefore a proportion of the drawn
   * width rather than a fixed number of pixels, so the figure keeps its
   * proportions at any size instead of turning into pins on a wide screen. */
  const HEAD = 0.154;
  const STEM = 0.045;

  function build(t, box) {
    const colourOf = tone => t.read(`--ev-${tone}`);
    const base = { fontFamily: t.font, fontSize: t.size };
    const band = t.read('--ev-band');
    const legendNames = scene.loaders.map(l => l.name);
    // The legend wraps at narrow widths; the title and grid start below it.
    const legend = legendLayout(legendNames, t, box.width);
    const legendTop = legend.bottom;
    const series = [];
    // The plot area, less the room the axis labels and names take.
    const pitch = Math.max(60, (box.width - 110)) / config.x.values.length;
    const head = Math.round(pitch * HEAD);
    const stem = Math.max(3, Math.round(pitch * STEM));

    scene.loaders.forEach((loader, l) => {
      const colour = colourOf(loader.tone);
      const points = loader.scores.map((score, i) => [i + (l === 0 ? -DODGE : DODGE), score]);

      /* The stems are a line series rather than a bar one. A bar on a value axis
         is laid out in a band shared with the other bar series, which shifts it
         off the head drawn at the same point; a line is placed exactly where its
         points are. One series holds all four stems, separated by nulls. */
      const stems = [];
      points.forEach(([x, y], i) => {
        if (i) stems.push(null);
        stems.push([x, scene.range[0]], [x, y]);
      });

      series.push({
        name: loader.name,
        type: 'line',
        data: stems,
        /* The legend takes its swatch from the first series with this name, which
           is this one, so it carries the colour and the loader's symbol even
           though the stems themselves draw neither. */
        symbol: loader.symbol,
        showSymbol: false,
        itemStyle: { color: colour },
        lineStyle: { color: colour, width: stem },
        silent: true,
        z: 2,

      });

      series.push({
        name: loader.name,
        type: 'scatter',
        data: points,
        symbol: loader.symbol,
        symbolSize: head,
        /* ECharts draws scatter marks at 0.8 opacity by default, which makes a
           head a paler version of the stem it sits on. They are one mark. */
        itemStyle: { color: colour, opacity: 1 },
        z: 3,
      });
    });

    // Keep the reference band independent of loader visibility; the caption explains it.
    series.push({ name: scene.bandName, type: 'bar', data: [], itemStyle: { color: band },
      markArea: { silent: true, itemStyle: { color: band },
        data: [[{ yAxis: scene.band[0] }, { yAxis: scene.band[1] }]] },
    });

    return {
      backgroundColor: 'transparent',
      animation: false,
      textStyle: base,
      legend: legend.option,
      title: {
        text: scene.suite,
        left: 'center', top: legendTop,
        textStyle: { ...base, color: t.ink, fontSize: t.titleSize, fontWeight: 600 },
      },
      tooltip: {
        /* Axis-triggered, as the throughput figures are: the reader points at a
           GPU count, not at a four-pixel mark. The two loaders sit either side of
           the rung so they share no x value, which is why the rung is derived
           from the axis value and both rows are built here rather than left to
           ECharts' own grouping. */
        trigger: 'axis',
        axisPointer: { type: 'line', snap: true, lineStyle: { color: t.line, width: 1 } },
        backgroundColor: t.surface, borderColor: t.line,
        textStyle: { ...base, color: t.ink },
        formatter: params => {
          const list = Array.isArray(params) ? params : [params];
          const index = Math.round(list[0].axisValue);
          const gpus = config.x.values[index];
          if (gpus === undefined) return '';
          const rows = scene.loaders.map(loader => {
            const swatch = `<span style="display:inline-block;width:9px;height:9px;` +
              `border-radius:50%;background:${colourOf(loader.tone)};margin-right:7px"></span>`;
            return `${swatch}${loader.name}` +
              `<span style="margin-left:20px;float:right;font-weight:600">` +
              `${decimal(loader.scores[index], 3)} pp</span>`;
          });
          // The band is what the scores are read against, so it belongs here too.
          rows.push(`<span style="opacity:0.75">${scene.bandName}` +
            `<span style="margin-left:20px;float:right">±${decimal(scene.noise, 3)} pp</span></span>`);
          return `<div style="font-weight:600;margin-bottom:5px">${gpus} GPUs</div>` +
            rows.join('<br>');
        },
      },
      grid: { left: 24, right: 8, top: legendTop + 34, bottom: 26, containLabel: true },
      xAxis: {
        type: 'value',
        min: -0.5,
        max: config.x.values.length - 0.5,
        name: config.x.label,
        nameLocation: 'middle',
        nameGap: 26,
        nameTextStyle: { ...base, color: t.ink, fontSize: t.nameSize },
        axisLine: { lineStyle: { color: t.line } },
        /* The axis is numeric so the stems can be placed exactly; the labels are
           the GPU counts those positions stand for. A value axis would otherwise
           tick at the half-integers its range starts on, which is between the
           pairs rather than under them. */
        axisLabel: {
          ...base, color: t.muted, fontSize: t.axisSize,
          customValues: config.x.values.map((_, i) => i),
          formatter: value => config.x.values[value] ?? '',
        },
        axisTick: { show: false, customValues: config.x.values.map((_, i) => i) },
        splitLine: { show: false },
      },
      yAxis: {
        type: 'value',
        min: scene.range[0],
        max: scene.range[1],
        scale: true,
        name: config.y.label,
        nameLocation: 'middle',
        nameGap: t.axisSize <= 11 ? 34 : 44,
        nameTextStyle: { ...base, color: t.ink, fontSize: t.nameSize },
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { ...base, color: t.muted, fontSize: t.axisSize, formatter: value => decimal(value) },
        splitLine: { lineStyle: { color: t.grid } },
      },
      series,
    };
  }
